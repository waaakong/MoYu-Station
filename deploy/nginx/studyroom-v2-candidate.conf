# Candidate validation is loopback-only and never exposed publicly.
server {
    listen 127.0.0.1:8280;
    server_name phase12-candidate.internal;
    root /srv/studyroom-v2/current/web;
    index index.html;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /api/system/health/ready {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8180;
        include /etc/nginx/studyroom/proxy-headers.conf;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8180;
        include /etc/nginx/studyroom/proxy-headers.conf;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/studyroom/proxy-headers.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}

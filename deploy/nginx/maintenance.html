<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>StudyRoom 维护中</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "PingFang SC", sans-serif; background: #101513; color: #edf4ef; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, #234238, #101513 55%); }
    main { width: min(34rem, calc(100vw - 3rem)); padding: 2.5rem; border: 1px solid #ffffff24; border-radius: 1.5rem; background: #17201dcc; box-shadow: 0 2rem 6rem #0008; }
    p { color: #b9c8bf; line-height: 1.75; } small { color: #82938a; }
  </style>
</head>
<body><main><h1>StudyRoom 正在维护</h1><p>我们正在完成一次受控升级。请稍后再试，现有数据不会被清理。</p><small>预计维护窗口：45—90 分钟</small></main></body>
</html>

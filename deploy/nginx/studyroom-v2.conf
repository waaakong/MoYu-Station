limit_req_zone $binary_remote_addr zone=studyroom_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=studyroom_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=studyroom_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=studyroom_ws:10m;

upstream studyroom_active_backend {
    include /etc/nginx/studyroom/upstream.conf;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name moyustation.xyz www.moyustation.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://moyustation.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moyustation.xyz www.moyustation.xyz;

    ssl_certificate /etc/letsencrypt/live/moyustation.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moyustation.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StudyRoomTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/studyroom-active-web;
    index index.html;
    client_max_body_size 12m;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options DENY always;
    # Add HSTS only after HTTPS and renewal have been verified in production.

    include /etc/nginx/studyroom/maintenance.conf;

    location = /api/system/health/ready { return 404; }
    location = /api/internal/client-updates/import { return 404; }
    location = /api/internal/client-updates/access { return 404; }

    location ~ ^/api/(auth/login|auth/register|auth/change-password)$ {
        limit_req zone=studyroom_auth burst=3 nodelay;
        proxy_pass http://studyroom_active_backend;
        include /etc/nginx/studyroom/proxy-headers.conf;
    }

    location /api/ {
        limit_req zone=studyroom_api burst=40 nodelay;
        proxy_pass http://studyroom_active_backend;
        include /etc/nginx/studyroom/proxy-headers.conf;
    }

    location /uploads/ {
        limit_req zone=studyroom_upload burst=3 nodelay;
        proxy_pass http://studyroom_active_backend;
        include /etc/nginx/studyroom/proxy-headers.conf;
    }

    location /ws/ {
        limit_conn studyroom_ws 4;
        proxy_pass http://studyroom_active_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/studyroom/proxy-headers.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

# The presence of maintenance.enabled activates a fail-closed static page.
if (-f /etc/nginx/studyroom/maintenance.enabled) {
    return 503;
}
error_page 503 @studyroom_maintenance;

location @studyroom_maintenance {
    internal;
    root /srv/studyroom-maintenance;
    try_files /maintenance.html =503;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 300 always;
}

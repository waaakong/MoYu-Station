location = /_studyroom_update_auth {
    internal;
    proxy_pass http://127.0.0.1:8080/api/internal/client-updates/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
}

location ~ ^/private-updates/releases/(stable|beta|provider-experimental)/([0-9A-Za-z.-]{5,64})/([A-Za-z0-9][A-Za-z0-9._-]{0,127})$ {
    limit_except GET HEAD { deny all; }
    auth_request /_studyroom_update_auth;
    alias /srv/studyroom-updates/releases/$1/$2/$3;
    disable_symlinks on from=/srv/studyroom-updates/releases;
    autoindex off;
    limit_conn studyroom_update_ip 2;
    limit_rate 2m;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "private, no-store" always;
    access_log /var/log/nginx/studyroom-updates.access.log combined;
}
